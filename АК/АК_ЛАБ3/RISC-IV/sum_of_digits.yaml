name: sum_of_digits
limit: 2000
memory_size: 5000
memory_mapped_io:
  0x80: [123]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {T0} {T1} {T2} {T3} 
      sp: {Sp:dec} el: {S0Fp:dec}
      {pc}: {instruction} {pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [6]