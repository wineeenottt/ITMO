name: rle_decompress
limit: 2000
memory_size: 0x2000
memory_mapped_io:
  0x80: [65,65,65,66,66,66,66,67,67,67,67, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      D0 {D0:dec}, D1 {D1:dec}, D2 {D2:dec}, D3 {D3:dec}, D7 {D7:dec}
      {SR:bin}
      {pc}:	{instruction}	{pc:label} 
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [51,65,52,66,52,67]
